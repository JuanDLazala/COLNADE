# Este sitio de Netlify sirve ÚNICAMENTE el Observatorio COLNADE, y no es
# producción: es el entorno donde se revisa y se aprueba. El Observatorio
# definitivo vive en colnade.co/observatorio, integrado por el desarrollador
# en la aplicación del Colegio. Por eso los canonical de cada página apuntan
# a colnade.co y no a este dominio.

[build]
  publish = "."

# Headers de seguridad para todas las páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache largo para assets de marca (imágenes/logos)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache corto para HTML (siempre fresco)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Entorno de revisión: nada de aquí debe indexarse nunca. El robots.txt ya
# lo bloquea, pero este header lo hace cumplir aunque alguien lo levante.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# El Observatorio subió de /observatorio/ a la raíz. Esta regla mantiene
# vivos los enlaces que ya se repartieron —el que tiene Javier apunta a
# /observatorio/revision.html— y los lleva a la página equivalente.
# El destino usa :splat, que es lo que capturó el * de origen.
[[redirects]]
  from = "/observatorio/*"
  to = "/:splat"
  status = 301
  force = true

# NO añadir un redirect de "/algo" a "/algo/". Netlify ignora la barra final
# al emparejar reglas, así que esa regla también captura "/algo/" y lo manda
# a sí mismo: bucle infinito y ERR_TOO_MANY_REDIRECTS. Netlify ya resuelve
# la barra final por su cuenta.
