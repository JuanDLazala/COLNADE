<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 178">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2e1a"/>
      <stop offset="100%" stop-color="#1a4a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6abf4b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2d7a4f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="178" fill="url(#sky)"/>
  <!-- Stars/particles -->
  <circle cx="40" cy="20" r="1.2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="120" cy="12" r="0.8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="200" cy="25" r="1" fill="rgba(255,255,255,0.3)"/>
  <circle cx="340" cy="15" r="1.2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="420" cy="30" r="0.8" fill="rgba(255,255,255,0.35)"/>
  <circle cx="460" cy="10" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="80" cy="45" r="0.7" fill="rgba(255,255,255,0.25)"/>
  <circle cx="280" cy="8" r="1" fill="rgba(255,255,255,0.4)"/>
  <!-- Glow circle -->
  <circle cx="240" cy="70" r="90" fill="url(#glow)"/>
  <!-- Mountains/hills -->
  <ellipse cx="80" cy="200" rx="130" ry="90" fill="#1a5c38" opacity="0.7"/>
  <ellipse cx="280" cy="210" rx="170" ry="100" fill="#15472d" opacity="0.8"/>
  <ellipse cx="430" cy="200" rx="120" ry="85" fill="#1a5c38" opacity="0.6"/>
  <!-- Trees left -->
  <polygon points="55,130 45,155 65,155" fill="#2d7a4f"/>
  <polygon points="55,115 42,140 68,140" fill="#3a9663"/>
  <rect x="52" y="155" width="6" height="12" fill="#1a3d28"/>
  <polygon points="75,125 65,150 85,150" fill="#2d7a4f"/>
  <polygon points="75,110 62,135 88,135" fill="#3a9663"/>
  <rect x="72" y="150" width="6" height="10" fill="#1a3d28"/>
  <!-- Trees right -->
  <polygon points="400,128 390,153 410,153" fill="#2d7a4f"/>
  <polygon points="400,113 387,138 413,138" fill="#3a9663"/>
  <rect x="397" y="153" width="6" height="12" fill="#1a3d28"/>
  <polygon points="420,133 410,155 430,155" fill="#2d7a4f"/>
  <rect x="417" y="155" width="6" height="10" fill="#1a3d28"/>
  <!-- Center tree big -->
  <polygon points="240,60 218,110 262,110" fill="#3a9663"/>
  <polygon points="240,80 214,130 266,130" fill="#2d7a4f"/>
  <polygon points="240,100 210,155 270,155" fill="#1f6642"/>
  <rect x="234" y="155" width="12" height="18" fill="#1a3d28"/>
  <!-- Leaf particles floating -->
  <ellipse cx="160" cy="80" rx="4" ry="2" fill="#6abf4b" opacity="0.5" transform="rotate(-30 160 80)"/>
  <ellipse cx="310" cy="65" rx="3" ry="1.5" fill="#6abf4b" opacity="0.4" transform="rotate(20 310 65)"/>
  <ellipse cx="190" cy="55" rx="3.5" ry="1.8" fill="#8dd45e" opacity="0.35" transform="rotate(-15 190 55)"/>
  <!-- Moon/sun hint -->
  <circle cx="380" cy="30" r="18" fill="rgba(255,230,100,0.15)"/>
  <circle cx="380" cy="30" r="12" fill="rgba(255,220,80,0.2)"/>
</svg>